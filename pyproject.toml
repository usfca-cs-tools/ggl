[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggl"
version = "0.1.0"
description = "Golden Gates Language - core Python engine for digital logic circuit simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Phil Peterson", email = "phpeterson@usfca.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
# A PATH executable so grading works regardless of how the autograder is installed
# (uv sync, uv tool install, ...): `uv tool install ggl` puts `ggl-grade` on PATH, and
# the project TOML invokes it directly instead of a `python3 -m ggl.grade` subprocess.
ggl-grade = "ggl.grade:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]


[tool.mypy]
mypy_path = "src"
packages = ["ggl"]
check_untyped_defs = true
